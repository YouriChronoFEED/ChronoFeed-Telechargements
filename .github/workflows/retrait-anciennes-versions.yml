name: Retrait des anciennes versions non protégées

# Workflow À USAGE UNIQUE : supprime définitivement les releases (et leurs étiquettes)
# v2.0.0 à v2.0.31 — les versions NON obscurcies — pour ne plus distribuer les binaires en clair.
# GARDE v2.0.32 (protégée) et les liens d'essai (mapping-essai, essai-*). À retirer après usage.
# Sécurité : ne s'exécute que si l'on tape exactement SUPPRIMER dans le champ de confirmation.

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Taper SUPPRIMER pour confirmer la suppression DÉFINITIVE de v2.0.0 à v2.0.31"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  retirer:
    if: ${{ github.event.inputs.confirmer == 'SUPPRIMER' }}
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les releases et étiquettes v2.0.0 → v2.0.31
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          set -u
          supprimees=0
          absentes=0
          for minor in $(seq 0 31); do
            tag="v2.0.$minor"
            if gh release view "$tag" -R "$DEPOT" >/dev/null 2>&1; then
              echo "Suppression de la release et de l'étiquette $tag ..."
              gh release delete "$tag" -R "$DEPOT" --yes --cleanup-tag
              supprimees=$((supprimees+1))
            else
              echo "$tag : absente, ignorée"
              absentes=$((absentes+1))
            fi
          done
          echo "=== Bilan : $supprimees supprimée(s), $absentes absente(s). ==="
          echo "Versions restantes :"
          gh release list -R "$DEPOT" --limit 50
